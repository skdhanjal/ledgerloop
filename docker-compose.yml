services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ledgerloop
      POSTGRES_DB: ledgerloop
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
volumes:
  pgdata:
